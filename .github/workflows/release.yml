name: Release

# Builds the book and attaches the PDF to a GitHub Release.
# Triggered by pushing a version tag:
#
#   git tag -a v0.1.0 -m "Chapter 1"
#   git push origin v0.1.0

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build a release for'
        required: true

permissions:
  contents: read

env:
  PDF_NAME: LangChain-LangGraph-Async-Python

jobs:
  build:
    name: Compile PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Render diagrams
        run: |
          shopt -s nullglob
          SRC=(figures/mermaid/*.mmd)
          mkdir -p figures/diagrams
          [ ${#SRC[@]} -eq 0 ] && exit 0
          printf '{"args":["--no-sandbox","--disable-dev-shm-usage"]}\n' > .puppeteer.json
          for f in "${SRC[@]}"; do
            key=$(basename "$f" .mmd)
            npx -y @mermaid-js/mermaid-cli@11 \
              -i "$f" -o "figures/diagrams/$key.pdf" \
              -p .puppeteer.json -c figures/mermaid/config.json \
              -b transparent --pdfFit
          done

      - name: Compile with latexmk
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error

      - name: Fail on unresolved references
        run: |
          if grep -q "Reference.*undefined" main.log; then
            echo "::error::Refusing to release with unresolved cross-references."
            grep "Reference.*undefined" main.log | sort -u
            exit 1
          fi

      - name: Name the artefact after the tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          mv main.pdf "${PDF_NAME}-${TAG}.pdf"
          cp "${PDF_NAME}-${TAG}.pdf" "${PDF_NAME}.pdf"

      - uses: actions/upload-artifact@v4
        with:
          name: release-pdf
          path: '*.pdf'

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write        # scoped to this job only, not the whole workflow
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: release-pdf

      - uses: softprops/action-gh-release@v2
        with:
          files: '*.pdf'
          generate_release_notes: true
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
